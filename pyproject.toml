[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "leaf5rt-metricsign"
version = "0.1.0"
description = "计算变化的置信区间与效应量，标出统计上无意义的变化"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "leaf5rt" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://leaf5rt.github.io"
Repository = "https://github.com/leaf5rt/metricsign"
Issues = "https://github.com/leaf5rt/metricsign/issues"

[project.scripts]
metricsign = "metricsign:main"

[tool.setuptools]
py-modules = ["metricsign"]
